# =============================================================================
# Render Blueprint — Infrastructure as Code
# =============================================================================
# После подключения репозитория добавь вручную в Render Dashboard:
#   Dashboard → steal-n-scroll-bot → Environment → Add Environment Variable:
#     BOT_TOKEN
#     OPENROUTER_API_KEY
#     TARGET_CHANNEL_ID
# Значения — в .env.example
#
# Потом настроить keep-alive:
#   https://cron-job.org → every 10 min → http://steal-n-scroll-bot.onrender.com

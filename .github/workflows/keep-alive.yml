# Keep-alive: пингует Render каждые 10 минут, чтобы не уснул (free tier)
name: Keep-Alive

on:
  schedule:
    - cron: "*/10 * * * *"  # каждые 10 минут
  workflow_dispatch:         # можно запустить вручную

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render
        run: curl -sSf -o /dev/null "https://steal-n-scroll-bot.onrender.com/"